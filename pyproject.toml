[project]
name = "kivi-var"
version = "0.1.0"
description = "Low-bit (KIVI) KV-cache quantization for Visual Autoregressive Modeling (VAR)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch==2.1.0",
    "torchvision==0.16.0",
    "numpy<2",
    "pillow",
    "scipy",
    "torch-fidelity",
    "huggingface-hub",  # imported by the VAR model code
]

[project.optional-dependencies]
# For the full per-item reproduction under analysis/ (OCR, face detection, LPIPS, figures).
# Pinned to the environment that produced the report (CPython 3.10); these exact versions
# coexist and all ship cp310 wheels. NOTE: the original env used the CPU `onnxruntime`
# (insightface/RetinaFace runs on it) — `onnxruntime-gpu` recent releases dropped cp310 wheels
# and would break `uv sync` on Python 3.10.
analysis = [
    "easyocr==1.7.2",
    "insightface==1.0.1",
    "onnxruntime==1.23.2",
    "lpips==0.1.4",
    "matplotlib==3.10.9",
    "opencv-python-headless==4.11.0.86",
]

# Pin the CUDA 12.1 PyTorch wheels (Linux); lab/server drivers commonly cap at CUDA 12.4.
[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["kivivar"]
