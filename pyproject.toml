[project]
name = "kivi-var"
version = "0.1.0"
description = "Low-bit (KIVI) KV-cache quantization for Visual Autoregressive Modeling (VAR)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch==2.1.0",
    "torchvision==0.16.0",
    "numpy<2",
    "pillow",
    "scipy",
    "torch-fidelity",
]

[project.optional-dependencies]
# for the full per-item reproduction under analysis/ (OCR, face detection, LPIPS, figures)
analysis = [
    "easyocr",
    "insightface",
    "onnxruntime-gpu",
    "lpips",
    "matplotlib",
    "opencv-python-headless",
]

# Pin the CUDA 12.1 PyTorch wheels (Linux); lab/server drivers commonly cap at CUDA 12.4.
[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["kivivar"]
